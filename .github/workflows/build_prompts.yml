name: Build JSON Database

on:
  push:
    branches: ["main"]
    paths:
      - "data/prompts.yaml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install pyyaml

      - name: Filter 18+ and build JSON with numeric_id
        run: |
          python -c "
          import yaml
          import json
          import re

          NSFW_KEYWORDS = [
              'sex', 'sexy', 'sexual', 'sexuality', 'erotic', 'erotica', 'eroticism',
              'porn', 'pornography', 'pornographic', 'xxx', 'adult content',
              'nude', 'nudity', 'naked', 'nakedness',
              'fetish', 'fetishism', 'kink', 'kinky', 'bdsm',
              'masturbat', 'orgasm', 'genitals', 'penis', 'vagina', 'breasts',
              'lingerie', 'stripper', 'striptease', 'escort', 'prostitut',
              'hentai', 'yuri', 'yaoi', 'loli', 'shota',
              'rape', 'molest', 'incest', 'underage', 'minor',
              'onlyfans', 'camgirl', 'camboy', 'nsfw', '18+', 'explicit',
              'horny', 'aroused', 'seduct', 'seduce', 'sensual',
              'threesome', 'orgy', 'hookup', 'one night stand',
              'naughty', 'dirty talk', 'dom', 'sub ', 'submissive',
              'domina', 'dominatrix', 'slave', 'bondage', 'spanking',
              'intimate', 'intercourse', 'fornication',
              'playboy', 'hustler', 'penthouse',
              'cum ', 'cumshot', 'blowjob', 'handjob',
              'af ', 'milf', 'dilf'
          ]

          def is_nsfw(prompt_data):
              text = ' '.join([
                  prompt_data.get('title', ''),
                  prompt_data.get('description', ''),
                  prompt_data.get('prompt', ''),
                  prompt_data.get('category', ''),
                  ' '.join(prompt_data.get('tags', []) or [])
              ]).lower()
              for keyword in NSFW_KEYWORDS:
                  if keyword in text:
                      return True
              return False

          with open('data/prompts.yaml', 'r', encoding='utf-8') as f:
              prompts = yaml.safe_load(f)

          clean_prompts = []
          skipped = 0

          for prompt in prompts:
              if is_nsfw(prompt):
                  skipped += 1
                  print(f'  FILTERED (18+): {prompt.get(\"title\", \"unknown\")}')
              else:
                  clean_prompts.append(prompt)

          print(f'Total filtered: {skipped} NSFW prompts removed')
          print(f'Clean prompts: {len(clean_prompts)}')

          with open('data/prompts.yaml', 'w', encoding='utf-8') as f:
              yaml.dump(clean_prompts, f, allow_unicode=True, default_flow_style=False, sort_keys=False, width=1000)

          output_prompts = []
          for i, prompt in enumerate(clean_prompts, start=1):
              ordered = {'numeric_id': i}
              for k, v in prompt.items():
                  ordered[k] = v
              output_prompts.append(ordered)

          with open('data/prompts.json', 'w', encoding='utf-8') as f:
              json.dump(output_prompts, f, ensure_ascii=False, indent=2, separators=(', ', ': '))
          "

      - name: Update prompt count in all READMEs
        run: |
          python -c "
          import json
          import re
          import os

          with open('data/prompts.json', 'r', encoding='utf-8') as f:
              prompts = json.load(f)
          count = len(prompts)
          formatted_count = f'{count:,}'
          print(f'Total prompts: {formatted_count}')

          readme_files = [
              'README.md', 'README_DE.md', 'README_ES.md', 'README_FR.md',
              'README_HI.md', 'README_IT.md', 'README_JA.md', 'README_KO.md',
              'README_PT.md', 'README_RU.md', 'README_ZH.md',
          ]

          pattern = re.compile(
              r'(https://img\.shields\.io/badge/[^-]+-)'
              r'[0-9][0-9%C.,]*'
              r'(-blue)'
          )

          for readme_file in readme_files:
              filepath = os.path.join('.', readme_file)
              if not os.path.exists(filepath):
                  print(f'  SKIP: {readme_file} not found')
                  continue
              with open(filepath, 'r', encoding='utf-8') as f:
                  content = f.read()
              url_count = formatted_count.replace(',', '%2C')
              new_content = pattern.sub(r'\g<1>' + url_count + r'\g<2>', content)
              if new_content != content:
                  with open(filepath, 'w', encoding='utf-8') as f:
                      f.write(new_content)
                  print(f'  UPDATED: {readme_file}')
              else:
                  print(f'  NO CHANGE: {readme_file}')
          "

      - name: Commit and Push JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prompts.json data/prompts.yaml README.md README_*.md
          if git diff --staged --quiet; then
            exit 0
          fi
          git commit -m "auto: generated prompts.json & updated prompt counts"
          git push
