name: Build JSON Database

on:
  push:
    branches: ["main"]
    paths:
      - "data/prompts.yaml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install pyyaml

      - name: Build JSON with numeric_id
        run: |
          python -c "
          import yaml
          import json
          import re
          import sys

          with open('data/prompts.yaml', 'r', encoding='utf-8') as f:
              prompts = yaml.safe_load(f)

          # ============================================================
          # English-language validation filter
          # Only blocks LETTERS from other languages, allows punctuation, digits, symbols
          # ============================================================

          NON_ENGLISH_LETTER_PATTERNS = [
              # Cyrillic letters only (not punctuation/numbers)
              re.compile(r'[\u0410-\u044f\u0451]'),  # А-я + ё
              # CJK letters (Chinese, Japanese, Korean)
              re.compile(r'[\u4e00-\u9fff\uac00-\ud7af]'),
              # Arabic letters
              re.compile(r'[\u0621-\u064a\u0660-\u0669]'),
              # Hebrew letters
              re.compile(r'[\u05d0-\u05ea]'),
              # Devanagari letters (Hindi, Sanskrit)
              re.compile(r'[\u0905-\u0939\u093d\u0940-\u094e\u0950\u0958-\u0961\u0964-\u0966]'),
              # Bengali letters
              re.compile(r'[\u0985-\u09b9\u09be-\u09c4\u09c7\u09c8\u09cb-\u09ce\u09d7\u09dc\u09dd\u09df\u09e0-\u09e3]'),
              # Thai letters
              re.compile(r'[\u0e01-\u0e3a\u0e40-\u0e4e\u0e4f]'),
              # Vietnamese special letters (not accented Latin)
              re.compile(r'[\u01a0\u01a1\u01af\u01b0\u1ea0-\u1eff]'),
              # Greek letters
              re.compile(r'[\u0391-\u03c9]'),
              # Korean Hangul letters
              re.compile(r'[\u1100-\u11ff]'),
              # Japanese Hiragana
              re.compile(r'[\u3040-\u309f]'),
              # Japanese Katakana
              re.compile(r'[\u30a0-\u30ff]'),
          ]

          def contains_non_english_letters(text):
              \"\"\"Check if text contains LETTERS from non-English languages.\"\"\"
              if not isinstance(text, str):
                  return False
              for pattern in NON_ENGLISH_LETTER_PATTERNS:
                  if pattern.search(text):
                      return True
              return False

          def validate_prompt(prompt, index):
              \"\"\"Validate that title, description, and prompt are English-only.\"\"\"
              errors = []
              
              fields_to_check = {
                  'title': prompt.get('title', ''),
                  'description': prompt.get('description', ''),
                  'prompt': prompt.get('prompt', ''),
              }
              
              for field_name, field_value in fields_to_check.items():
                  if contains_non_english_letters(field_value):
                      errors.append(
                          f'   Prompt #{index} [{field_name}]: contains non-English letters'
                      )
              
              return errors

          # ============================================================
          # Validation & Build
          # ============================================================

          print('=' * 60)
          print('Validating prompts for English-only letters...')
          print('=' * 60)

          all_errors = []
          for i, prompt in enumerate(prompts, start=1):
              errors = validate_prompt(prompt, i)
              all_errors.extend(errors)

          if all_errors:
              print()
              print('VALIDATION FAILED - Non-English letters detected:')
              print()
              for error in all_errors:
                  print(error)
              print()
              print('Please remove all non-English letters from the prompts.')
              print('=' * 60)
              sys.exit(1)

          print(f'All {len(prompts)} prompts passed English-only validation.')
          print('=' * 60)

          # Build output
          output_prompts = []
          for i, prompt in enumerate(prompts, start=1):
              ordered = {'numeric_id': i}
              for k, v in prompt.items():
                  ordered[k] = v
              output_prompts.append(ordered)

          with open('data/prompts.json', 'w', encoding='utf-8') as f:
              json.dump(output_prompts, f, ensure_ascii=False, indent=2, separators=(', ', ': '))

          print(f'Successfully built data/prompts.json with {len(output_prompts)} prompts.')
          "

      - name: Update prompt count in all READMEs
        run: |
          python -c "
          import json
          import re
          import os

          with open('data/prompts.json', 'r', encoding='utf-8') as f:
              prompts = json.load(f)
          count = len(prompts)
          formatted_count = f'{count:,}'
          print(f'Total prompts: {formatted_count}')

          readme_files = [
              'README.md', 'README_DE.md', 'README_ES.md', 'README_FR.md',
              'README_HI.md', 'README_IT.md', 'README_JA.md', 'README_KO.md',
              'README_PT.md', 'README_RU.md', 'README_ZH.md',
          ]

          pattern = re.compile(
              r'(https://img\.shields\.io/badge/[^-]+-)'
              r'[0-9][0-9%C.,]*'
              r'(-blue)'
          )

          for readme_file in readme_files:
              filepath = os.path.join('.', readme_file)
              if not os.path.exists(filepath):
                  print(f'  SKIP: {readme_file} not found')
                  continue
              with open(filepath, 'r', encoding='utf-8') as f:
                  content = f.read()
              url_count = formatted_count.replace(',', '%2C')
              new_content = pattern.sub(r'\g<1>' + url_count + r'\g<2>', content)
              if new_content != content:
                  with open(filepath, 'w', encoding='utf-8') as f:
                      f.write(new_content)
                  print(f'  UPDATED: {readme_file}')
              else:
                  print(f'  NO CHANGE: {readme_file}')
          "

      - name: Commit and Push JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prompts.json data/prompts.yaml README.md README_*.md
          if git diff --staged --quiet; then
            exit 0
          fi
          git commit -m "auto: generated prompts.json & updated prompt counts"
          git push
