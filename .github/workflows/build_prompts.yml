name: Build JSON Database

on:
  push:
    branches: ["main"]
    paths:
      - "data/prompts.yaml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install pyyaml

      - name: Convert YAML to JSON
        run: |
          python -c "
          import yaml, json
          with open('data/prompts.yaml', 'r', encoding='utf-8') as f:
              data = yaml.safe_load(f)
          with open('data/prompts.json', 'w', encoding='utf-8') as f:
              json.dump(data, f, ensure_ascii=False, separators=(',', ':'))
          "

      - name: Commit and Push JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prompts.json
          if git diff --staged --quiet; then
            exit 0
          fi
          git commit -m "auto: generated prompts.json for frontend"
          git push
